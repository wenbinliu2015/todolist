<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="聚焦今日、按优先级安排任务的日程清单。" />
  <title>日程清单</title>
  <style>
    :root { color-scheme:light; --ink:#17233c; --muted:#727e98; --line:#dfe5ef; --paper:rgba(255,255,255,.92); --blue:#2962ff; --blue-dark:#1949d8; --navy:#15233f; --green:#18a979; --amber:#e99a19; --red:#e04b59; --shadow:0 22px 65px rgba(36,58,102,.12); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif; color:var(--ink); background:radial-gradient(circle at 6% 4%,rgba(41,98,255,.16),transparent 31rem),radial-gradient(circle at 94% 88%,rgba(18,184,153,.14),transparent 30rem),linear-gradient(160deg,#f7f9fd 0%,#edf3fb 100%); }
    button,input,select { font:inherit; } button { cursor:pointer; }
    .shell { width:min(1080px,calc(100% - 36px)); margin:auto; padding:52px 0 64px; }
    .top { display:flex; justify-content:space-between; align-items:end; gap:24px; margin-bottom:24px; }
    .eyebrow { margin:0 0 8px; color:var(--blue); font-size:.78rem; font-weight:800; letter-spacing:.17em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(2.3rem,5vw,4rem); line-height:.98; letter-spacing:-.055em; }
    .date { margin:10px 0 0; color:var(--muted); }
    .progress { width:76px; height:76px; display:grid; place-items:center; flex:0 0 auto; position:relative; border-radius:50%; background:conic-gradient(var(--green) var(--progress),#e1e7f0 0); }
    .progress::before { content:""; position:absolute; inset:7px; border-radius:50%; background:#f4f7fb; }
    .progress span { position:relative; font-size:.9rem; font-weight:800; }
    .card { border:1px solid rgba(214,222,235,.92); border-radius:26px; background:var(--paper); box-shadow:var(--shadow); overflow:hidden; backdrop-filter:blur(15px); }
    .focus { margin-bottom:20px; color:white; border-color:rgba(255,255,255,.08); background:radial-gradient(circle at 92% 5%,rgba(74,127,255,.35),transparent 17rem),linear-gradient(135deg,#18305a,#101c33); box-shadow:0 24px 70px rgba(20,35,64,.22); }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 22px; border-bottom:1px solid var(--line); }
    .focus .section-head { border-color:rgba(255,255,255,.1); }
    .section-head h2 { margin:0; font-size:1.22rem; letter-spacing:-.02em; }
    .section-head p { margin:4px 0 0; color:var(--muted); font-size:.86rem; }
    .focus .section-head p { color:#aebbd2; }
    .focus-count { padding:7px 11px; border-radius:999px; color:#d8e3ff; background:rgba(255,255,255,.09); font-size:.8rem; font-weight:750; }
    .focus-list,.task-list { list-style:none; margin:0; padding:8px 18px; }
    .focus-item,.task-item { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:13px; align-items:center; padding:14px 4px; border-bottom:1px solid; }
    .focus-item { border-color:rgba(255,255,255,.09); }
    .task-item { border-color:var(--line); }
    .focus-item:last-child,.task-item:last-child { border-bottom:0; }
    .check { width:25px; height:25px; padding:0; display:grid; place-items:center; border:2px solid #aab7cd; border-radius:8px; color:white; background:transparent; }
    .done .check { border-color:var(--green); background:var(--green); }
    .task-main { min-width:0; }
    .task-title { display:block; font-size:1rem; line-height:1.4; overflow-wrap:anywhere; }
    .done .task-title { opacity:.55; text-decoration:line-through; }
    .meta { display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin-top:6px; color:#acb9cf; font-size:.78rem; }
    .task-item .meta { color:var(--muted); }
    .priority { display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:999px; font-size:.72rem; font-weight:800; }
    .priority::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
    .p-high { color:#ff8690; background:rgba(224,75,89,.14); }
    .p-medium { color:#f1b34d; background:rgba(233,154,25,.14); }
    .p-low { color:#62d5b2; background:rgba(24,169,121,.14); }
    .delete { width:36px; height:36px; border:0; border-radius:10px; color:#94a1b7; background:transparent; font-size:1.25rem; opacity:0; }
    li:hover .delete,.delete:focus-visible { opacity:1; }
    .delete:hover { color:var(--red); background:rgba(224,75,89,.1); }
    .empty { padding:44px 24px; text-align:center; color:var(--muted); }
    .focus .empty { color:#aebbd2; }
    .empty strong { display:block; margin-bottom:5px; color:inherit; font-size:1rem; }
    .add-card { margin-bottom:24px; border-color:#cfdbf7; background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(232,239,255,.94)); box-shadow:0 20px 58px rgba(41,98,255,.11); }
    .add-card .section-head { border-color:#d8e2f8; }
    .add-card .section-head h2 { color:#214cae; }
    .composer { display:grid; grid-template-columns:1.3fr .7fr; gap:13px; padding:20px 22px 22px; }
    .field label { display:block; margin:0 0 6px 3px; color:var(--muted); font-size:.78rem; font-weight:750; }
    .field input,.field select,.edit-grid input,.edit-grid select { width:100%; min-width:0; height:45px; padding:0 12px; border:1px solid var(--line); border-radius:12px; outline:none; color:var(--ink); background:white; }
    .field input:focus,.field select:focus,.edit-grid input:focus,.edit-grid select:focus { border-color:var(--blue); box-shadow:0 0 0 4px rgba(41,98,255,.1); }
    .task-field { grid-column:1/2; }
    .priority-field { grid-column:2/3; }
    .datetime-grid { grid-column:1/-1; display:grid; grid-template-columns:1fr .72fr 1fr .72fr; gap:10px; }
    .add-row { grid-column:1/-1; display:flex; justify-content:flex-end; align-items:center; gap:14px; }
    .form-error { margin:0 auto 0 0; color:var(--red); font-size:.86rem; }
    .add { height:46px; padding:0 24px; border:0; border-radius:13px; color:white; background:var(--blue); box-shadow:0 8px 20px rgba(41,98,255,.22); font-weight:760; }
    .add:hover { background:var(--blue-dark); }
    .planner { display:block; }
    .calendar { width:min(100%,760px); margin:0 auto; padding:24px; border-color:#c9e8df; background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(226,248,242,.94)); box-shadow:0 20px 58px rgba(24,169,121,.12); }
    .calendar-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .calendar-head h2 { margin:0; color:#147d62; font-size:1.15rem; }
    .month-nav { display:flex; gap:6px; }
    .icon-btn { width:36px; height:36px; border:0; border-radius:11px; background:#eef2f8; color:var(--ink); font-size:1.2rem; }
    .icon-btn:hover { color:var(--blue); background:#e6edff; }
    .weekdays,.days { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
    .weekdays span { padding:5px 0; text-align:center; color:var(--muted); font-size:.72rem; font-weight:700; }
    .day { aspect-ratio:1; min-width:0; position:relative; border:0; border-radius:11px; color:var(--ink); background:transparent; font-size:.86rem; }
    .day:hover { background:#eef2f8; }
    .day.today { color:var(--blue); box-shadow:inset 0 0 0 1px var(--blue); font-weight:800; }
    .day.selected { color:white; background:var(--blue); box-shadow:0 7px 15px rgba(41,98,255,.24); font-weight:800; }
    .day.blank { visibility:hidden; }
    .badge { position:absolute; right:4px; bottom:3px; min-width:14px; height:14px; padding:0 3px; display:grid; place-items:center; border-radius:8px; color:white; background:var(--green); font-size:.58rem; font-weight:800; }
    .selected .badge { color:var(--blue); background:white; }
    .today-btn { width:100%; margin-top:14px; padding:9px; border:0; border-radius:11px; color:var(--blue); background:rgba(41,98,255,.08); font-weight:750; }
    .footer { display:flex; justify-content:space-between; gap:16px; margin-top:18px; color:var(--muted); font-size:.84rem; }
    @media (max-width:620px) { .shell { width:min(100% - 20px,1080px); padding:34px 0; } .top { align-items:center; } .progress { width:64px; height:64px; } .card { border-radius:21px; } .composer { grid-template-columns:1fr; padding:16px; } .task-field,.priority-field { grid-column:1; } .datetime-grid { grid-template-columns:1fr 1fr; } .section-head { align-items:flex-start; padding:17px 16px; } .focus-list { padding:6px 12px; } .delete { opacity:1; } .calendar { padding:16px; } }
    @media (prefers-reduced-motion:reduce) { * { animation:none!important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div><p class="eyebrow">Focus first</p><h1>日程清单</h1><p class="date" id="todayLabel"></p></div><div class="progress" id="progress" aria-label="今日完成进度"><span>0%</span></div></header>

    <section class="card focus" aria-labelledby="focusTitle"><div class="section-head"><div><h2 id="focusTitle">今日重点</h2><p>未完成任务，以及今天开始或截止的任务</p></div><span class="focus-count" id="focusCount">0 项</span></div><ul class="focus-list" id="focusList"></ul><div class="empty" id="focusEmpty" hidden><strong>今日已清空</strong><span>没有需要关注的任务。</span></div></section>

    <section class="card add-card" aria-labelledby="addTitle"><div class="section-head"><div><h2 id="addTitle">添加任务</h2><p>时间按 30 分钟设置，选择开始时间后自动预留半小时</p></div></div><form class="composer" id="form"><div class="field task-field"><label for="taskInput">任务内容</label><input id="taskInput" maxlength="120" autocomplete="off" placeholder="接下来要完成什么？" required /></div><div class="field priority-field"><label for="priorityInput">紧急程度</label><select id="priorityInput"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select></div><div class="datetime-grid"><div class="field"><label for="startDate">开始日期</label><input id="startDate" type="date" required /></div><div class="field"><label for="startTime">开始时间</label><select id="startTime" required></select></div><div class="field"><label for="endDate">截止日期</label><input id="endDate" type="date" required /></div><div class="field"><label for="endTime">截止时间</label><select id="endTime" required></select></div></div><div class="add-row"><p class="form-error" id="formError" hidden></p><button class="add" type="submit">添加到清单</button></div></form></section>

    <div class="planner"><section class="card calendar" aria-label="任务日历"><div class="calendar-head"><h2 id="monthTitle"></h2><div class="month-nav"><button class="icon-btn" id="prevMonth" type="button" aria-label="上个月">‹</button><button class="icon-btn" id="nextMonth" type="button" aria-label="下个月">›</button></div></div><div class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="days" id="calendarDays"></div><button class="today-btn" id="goToday" type="button">回到今天</button></section></div>
    <footer class="footer"><span>任务数据保存在当前设备</span><span>高优先级 · 临近截止优先</span></footer>
  </main>
  <script>
    const KEY='daily-todos-v1',labels={low:'低',medium:'中',high:'高'},scores={low:1,medium:2,high:3};
    const pad=n=>String(n).padStart(2,'0'),dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=dateKey(new Date()),at=(d,t)=>`${d}T${t}`;
    const slots=Array.from({length:48},(_,i)=>`${pad(Math.floor(i/2))}:${i%2?'30':'00'}`),slotOptions=slots.map(t=>`<option value="${t}">${t}</option>`).join('');
    document.querySelector('#startTime').innerHTML=slotOptions; document.querySelector('#endTime').innerHTML=slotOptions;
    const seed=[{id:crypto.randomUUID(),text:'整理今天的优先事项',done:true,startAt:at(today,'09:00'),endAt:at(today,'09:30'),priority:'medium'},{id:crypto.randomUUID(),text:'完成项目方案初稿',done:false,startAt:at(today,'10:00'),endAt:at(today,'12:00'),priority:'high'},{id:crypto.randomUUID(),text:'散步 20 分钟',done:false,startAt:at(today,'18:30'),endAt:at(today,'19:00'),priority:'low'}];
    let tasks; try{tasks=JSON.parse(localStorage.getItem(KEY))??seed}catch{tasks=seed} tasks=tasks.map((t,i)=>({...t,startAt:t.startAt||at(today,`${pad(9+i)}:00`),endAt:t.endAt||at(today,`${pad(10+i)}:00`),priority:t.priority||'medium'}));
    let selectedDate=today,visibleMonth=new Date(`${today}T12:00`);
    const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(tasks)),esc=v=>{const e=document.createElement('span');e.textContent=v;return e.innerHTML},covers=(t,d)=>t.startAt.slice(0,10)<=d&&t.endAt.slice(0,10)>=d;
    const formatRange=t=>`${t.startAt.slice(0,10)===today?'今天':t.startAt.slice(5,10)} ${t.startAt.slice(11,16)} → ${t.endAt.slice(0,10)===today?'今天':t.endAt.slice(5,10)} ${t.endAt.slice(11,16)}`;
    const sortTasks=(a,b)=>scores[b.priority]-scores[a.priority]||a.endAt.localeCompare(b.endAt);
    function addThirty(){const d=new Date(`${$('#startDate').value}T${$('#startTime').value}:00`);if(Number.isNaN(d.getTime()))return;d.setMinutes(d.getMinutes()+30);$('#endDate').value=dateKey(d);$('#endTime').value=`${pad(d.getHours())}:${pad(d.getMinutes())}`;}
    function setDefaults(day=selectedDate){$('#startDate').value=day;$('#startTime').value='09:00';addThirty();}
    function priorityPill(p){return `<span class="priority p-${p}">${labels[p]}</span>`;}
    function taskRow(t){return `<li class="focus-item ${t.done?'done':''}" data-id="${t.id}"><button class="check" type="button" aria-label="${t.done?'标记为未完成':'标记为已完成'}">${t.done?'✓':''}</button><div class="task-main"><span class="task-title">${esc(t.text)}</span><div class="meta">${priorityPill(t.priority)}<span>${formatRange(t)}</span>${t.endAt<new Date().toISOString().slice(0,16)&&!t.done?'<span>已逾期</span>':''}</div></div><button class="delete" type="button" aria-label="删除任务">×</button></li>`;}
    function renderFocus(){const focus=tasks.filter(t=>!t.done||t.startAt.slice(0,10)===today||t.endAt.slice(0,10)===today).sort(sortTasks);$('#focusList').innerHTML=focus.map(t=>taskRow(t)).join('');$('#focusList').hidden=!focus.length;$('#focusEmpty').hidden=!!focus.length;$('#focusCount').textContent=`${focus.filter(t=>!t.done).length} 项未完成`;const todays=tasks.filter(t=>covers(t,today)),done=todays.filter(t=>t.done).length,pct=todays.length?Math.round(done/todays.length*100):0;$('#progress').style.setProperty('--progress',pct+'%');$('#progress span').textContent=pct+'%';}
    function renderCalendar(){const y=visibleMonth.getFullYear(),m=visibleMonth.getMonth();$('#monthTitle').textContent=`${y} 年 ${m+1} 月`;const offset=(new Date(y,m,1).getDay()+6)%7,total=new Date(y,m+1,0).getDate(),cells=[];for(let i=0;i<offset;i++)cells.push('<span class="day blank"></span>');for(let d=1;d<=total;d++){const key=`${y}-${pad(m+1)}-${pad(d)}`,count=tasks.filter(t=>covers(t,key)).length;cells.push(`<button type="button" class="day ${key===today?'today':''} ${key===selectedDate?'selected':''}" data-date="${key}" aria-label="${m+1}月${d}日，${count}项任务">${d}${count?`<span class="badge">${count}</span>`:''}</button>`)}$('#calendarDays').innerHTML=cells.join('');}
    const render=()=>{renderFocus();renderCalendar();save();};
    $('#todayLabel').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date()); setDefaults(today); render();
    $('#startDate').addEventListener('change',addThirty); $('#startTime').addEventListener('change',addThirty);
    $('#form').addEventListener('submit',e=>{e.preventDefault();const text=$('#taskInput').value.trim(),startAt=at($('#startDate').value,$('#startTime').value),endAt=at($('#endDate').value,$('#endTime').value);$('#formError').hidden=true;if(!text)return;if(endAt<startAt){$('#formError').textContent='截止时间不能早于开始时间。';$('#formError').hidden=false;return}tasks.push({id:crypto.randomUUID(),text,done:false,startAt,endAt,priority:$('#priorityInput').value});$('#taskInput').value='';render();});
    function listClick(e){const item=e.target.closest('li[data-id]');if(!item)return;if(e.target.closest('.check'))tasks=tasks.map(t=>t.id===item.dataset.id?{...t,done:!t.done}:t);if(e.target.closest('.delete'))tasks=tasks.filter(t=>t.id!==item.dataset.id);render();}
    $('#focusList').addEventListener('click',listClick);
    $('#calendarDays').addEventListener('click',e=>{const b=e.target.closest('[data-date]');if(!b)return;selectedDate=b.dataset.date;visibleMonth=new Date(`${selectedDate}T12:00`);setDefaults(selectedDate);render();}); $('#prevMonth').addEventListener('click',()=>{visibleMonth=new Date(visibleMonth.getFullYear(),visibleMonth.getMonth()-1,1);renderCalendar()}); $('#nextMonth').addEventListener('click',()=>{visibleMonth=new Date(visibleMonth.getFullYear(),visibleMonth.getMonth()+1,1);renderCalendar()}); $('#goToday').addEventListener('click',()=>{selectedDate=today;visibleMonth=new Date(`${today}T12:00`);setDefaults(today);render();});
    if(document.modelContext?.registerTool)Promise.resolve(document.modelContext.registerTool({name:'add_prioritized_todo',title:'添加优先任务',description:'添加带起止时间和紧急程度的任务。',inputSchema:{type:'object',properties:{text:{type:'string',minLength:1,maxLength:120},startAt:{type:'string'},endAt:{type:'string'},priority:{type:'string',enum:['low','medium','high']}},required:['text','startAt','endAt','priority'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute({text,startAt,endAt,priority}){const value=typeof text==='string'?text.trim():'';if(!value||!/^\d{4}-\d{2}-\d{2}T(?:[01]\d|2[0-3]):(?:00|30)$/.test(startAt)||!/^\d{4}-\d{2}-\d{2}T(?:[01]\d|2[0-3]):(?:00|30)$/.test(endAt)||endAt<startAt||!labels[priority])throw new Error('任务内容、时间或紧急程度无效。');const task={id:crypto.randomUUID(),text:value,done:false,startAt,endAt,priority};tasks.push(task);render();return task;}})).catch(()=>{});
  </script>
</body>
</html>
